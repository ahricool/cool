name: personal-cms
x-backend: &backend
  image: ${CMS_IMAGE:?Set CMS_IMAGE to an immutable image tag}
  environment: &environment
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: ${DATABASE_URL:?Set container DATABASE_URL with database hostname}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    MEDIA_ROOT: /app/data/uploads
    # Only proxy publishes a host port; it replaces all forwarding headers.
    TRUST_PROXY_HOPS: '1'
  init: true
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    profiles: [tools]
    command: ['npm', 'run', 'db:deploy']
    depends_on:
      database:
        condition: service_healthy
  seed:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    command: ['node', 'apps/backend/dist/seed.js']
    depends_on:
      database:
        condition: service_healthy
  backend:
    <<: *backend
    build: .
    volumes:
      - media_data:/app/data
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    image: ${CMS_FRONTEND_IMAGE:?Set CMS_FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    init: true
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_BASE: http://backend:3000/api/v1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  admin:
    image: ${CMS_ADMIN_IMAGE:?Set CMS_ADMIN_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/admin/']
      interval: 10s
      timeout: 5s
      retries: 10
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
volumes:
  media_data:
  postgres_data:
