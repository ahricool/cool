name: Build and publish Cool
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile
          - service: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One multi-platform build per service; BuildKit keys layers by platform.
          cache-from: type=gha,scope=${{ matrix.service }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-multiarch
