limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
  listen 80;
  server_tokens off;
  client_max_body_size 9m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;
  set $frontend http://frontend:3000;
  set $admin http://admin:80;
  location = /api/v1/admin/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace untrusted client headers rather than appending a forwarded chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location = /admin { return 301 /admin/; }
  location /admin/ { proxy_pass $admin; proxy_set_header Host $host; }
  location / { proxy_pass $frontend; proxy_set_header Host $host; }
}
