limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
  listen 80;
  server_tokens off;
  client_max_body_size 9m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/v1/admin/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace untrusted client headers rather than appending a forwarded chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/v1/admin/auth/setup {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location = /admin {
    # Preserve external scheme/port behind Docker or a TLS gateway.
    absolute_redirect off;
    return 301 /admin/;
  }
  # Missing bundles and images must not accidentally return the SPA HTML.
  location /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /sakura/ { try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
