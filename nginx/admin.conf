server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  location /admin/assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; add_header Cache-Control "no-cache"; }
  location / { return 404; }
}
